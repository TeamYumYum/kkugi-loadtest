# 발생기 기본 설정. 다른 파일을 쓰려면 KKUGI_CONFIG에 경로를 준다.
# "가정"으로 적은 값은 확정 사양이 아니다. 실측이나 팀 합의가 나오면 바꾼다.
# 비밀값(토큰, 비밀 헤더 값)은 이 파일에 쓰지 않는다.

timezone = "Asia/Seoul"
api_prefix = "/api/v1"

[accounts]
# 인공 계정 이메일은 {email_prefix}-{번호 5자리}@{email_domain}이다.
# 서비스는 provider EMAIL_DEV이고 이메일이 lt-%@synthetic.kkugi.test인 회원을 인공 회원으로 센다(auth.md 5.5절).
# 바꾸면 이미 만든 회원과 패턴이 어긋난다
email_prefix = "lt"
email_domain = "synthetic.kkugi.test"
# 계정별 페르소나, 프로필, 하루 일정을 뽑는 난수 시드. 바꾸면 모든 계정의 값이 바뀐다
seed = 20261028

[auth]
# dev 로그인(POST /auth/login/dev)만 지원한다. 운영에서도 인공 트래픽용으로 켜져 있다(S15P31E101-342)
method = "dev"
# 액세스 토큰 만료까지 남은 시간이 이보다 짧으면 요청 전에 재발급한다(초)
refresh_margin_seconds = 120

[synthetic]
# 인공 요청 구분 헤더. 로그인을 포함한 모든 요청에 붙인다. backend는 이 헤더로 지표 태그 synthetic,
# 로그 필드 synthetic, span 속성을 남긴다(S15P31E101-342). 비우면 헤더를 붙이지 않는다
header_name = "X-Synthetic-Traffic"
header_value = "1"

[traffic]
# 계정이 h시 시간대에 앱을 열 확률 = open_probability[h] × 페르소나 activity × 계정 활동 배수.
# 계정마다 시간대별로 한 번 뽑으므로 한 시간대에 한 계정의 세션은 최대 하나다.
# 계정 수 × 확률이 그 시간대의 시간당 세션 수 기대값이다(계정 20,000개에 0.5면 10,000).
# 값은 사용자 확정값이다(2026-10-29, notes/decisions/2026-10-29-hourly-table.md)

# 0~23시(한국 시간) 각 시간대에 계정 하나가 앱을 열 확률. 24개, 0~1.
# 밤(1~5시) 0.01, 피크(7, 12, 18시) 0.5, 피크 앞뒤 완충(6, 8, 11, 13, 17, 19시) 0.25, 나머지 0.1
open_probability = [
  # 0     1     2     3     4     5     6     7
  0.1,  0.01, 0.01, 0.01, 0.01, 0.01, 0.25, 0.5,
  # 8     9     10    11    12    13    14    15
  0.25, 0.1,  0.1,  0.25, 0.5,  0.25, 0.1,  0.1,
  # 16    17    18    19    20    21    22    23
  0.1,  0.25, 0.5,  0.25, 0.1,  0.1,  0.1,  0.1,
]
# 계정 활동 배수와 비중 [배수, 비중]. 계정마다 시드와 계정 번호로 하나를 고정해 부지런한 계정과 뜸한 계정을 나눈다.
# 비중을 곱한 평균 배수는 1이어야 한다. 확률 최댓값 × 가장 큰 페르소나 activity × 가장 큰 배수는 1 이하여야 한다
activity_multipliers = [[0.5, 1], [1.0, 2], [1.5, 1]]

[control]
# 시작할 때의 배율(0~1). 계획된 세션을 이 확률로만 실행한다. 세션마다 계정·날짜·시간대로 정해지는 값과
# 비교하므로 배율을 바꿔도 같은 세션이 일관되게 남거나 빠진다. 0이면 아무 세션도 실행하지 않는다(정지).
# 운영 중에는 Master 웹 UI의 /kkugi/scale, /kkugi/stop으로 바꾼다. 설정 다시 읽기(/kkugi/reload)는
# 이 값을 다시 적용하지 않는다. 시작할 때만 쓴다
scale = 1.0

[governor]
# 거버너(kkugi_load/governor.py). Master(또는 단독 실행)가 주기마다 최근 창의 HTTP 요청 실패율과 p99 응답 시간을
# 보고, 기준을 넘으면 실제 배율을 절반으로 낮춘다. 정상이 이어지면 recovery_step씩 올리되 사람이 정한 배율
# (/kkugi/scale)을 넘지 않는다. 세션·일정·계정 통계(SESSION, SCHEDULE, ACCOUNT)는 보지 않는다.
# 설정 다시 읽기(/kkugi/reload)로 바꾸면 다음 확인부터 새 값을 쓴다. 끄면 사람이 정한 배율로 되돌린다
# 켜기(true)·끄기(false)
enabled = true
# 확인 주기(초). 계획 2-3에서 정한 값이다(가정 아님)
interval_seconds = 60
# 판단에 쓰는 창 길이(초). 확인 주기 이상이어야 한다. 배율을 낮춘 뒤에는 이만큼 새로 쌓일 때까지 판단하지 않는다.
# 계획 2-3에서 정한 값이다(가정 아님)
window_seconds = 300
# 창 안의 HTTP 실패 비율이 이 값을 넘으면 낮춘다(0~1 미만). 가정
max_failure_ratio = 0.02
# 창 안의 HTTP p99 응답 시간이 이 값을 넘으면 낮춘다(ms). 가정
max_p99_ms = 3000
# 창 안의 HTTP 요청이 이보다 적으면 판단하지 않는다. 밤처럼 요청이 적을 때 한두 건의 실패로 낮추지 않게 한다. 가정
min_requests = 200
# 이만큼(초) 계속 정상이면 배율을 한 단계 올린다. 계획 2-3의 값이지만 실측 전이라 가정
recovery_seconds = 600
# 회복 한 단계에 올리는 배율(0 초과 1 이하). 계획 2-3의 값이지만 실측 전이라 가정
recovery_step = 0.1

# --- 계정 풀 ---
# Worker는 KKUGI_POOL로 풀 하나를 고르고 그 범위의 계정만 실행한다. 풀끼리 번호 범위가 겹치면 안 된다.
# Master는 실행 중인 Worker끼리 계정 범위가 겹치면 나중에 붙은 Worker를 거부한다.
# only_between이 있으면 그 시간대(한국 시간)에 계획된 세션만 실행한다.

[pools.base]
# 서버의 상시 Worker(프라이빗 경로). 계정 수를 늘릴 때 public과 같은 비율(95:5)로 함께 늘린다
start = 0
count = 950

[pools.public]
# 공인 경로 전용 Worker. base와 같은 비율로 함께 늘린다. KKUGI_ROUTE=public으로 띄워 HTTP 요청 통계 이름에
# [public]을 붙인다. 요청의 5%를 공인 주소로 보내기 위한 풀이다(notes/decisions/2026-10-29-route-split.md)
start = 950
count = 50

[pools.peak-1]
# 팀원 노트북 Worker. 피크 시간대에만 추가 인구로 활동한다. 노트북마다 다른 풀을 쓴다. 가정
start = 10000
count = 1000
only_between = [["11:30", "13:30"], ["17:30", "19:30"]]

[pools.peak-2]
start = 11000
count = 1000
only_between = [["11:30", "13:30"], ["17:30", "19:30"]]

[schedule]
# 계획 시각보다 이만큼 늦으면 실행하지 않고 놓친 세션으로 센다(분). 실행기가 모자라면 늘어난다. 가정
max_lateness_minutes = 30

[think_time]
# 사용자가 검색어를 입력하고 결과에서 음식을 고르는 시간(초). 가정
search_min = 2.0
search_max = 6.0
select_min = 1.0
select_max = 4.0

# --- 페르소나 ---
# weight는 계정에 페르소나를 배정하는 비율이다. 구현한 페르소나만 둔다.
# 비율을 바꾸면 이미 쓰던 계정의 페르소나가 바뀔 수 있다. 상태 DB와 어긋나면 발생기가 그 계정을 거부한다.

[personas.dieter]
# 팀 문서의 비율은 35%다(가정). 지금은 다이어터만 구현해 모든 계정이 다이어터다
weight = 35
# 페르소나 활동 배수. 공통 표의 확률에 곱한다. 필수 값이다
activity = 1.0
# 한 끼의 음식 수와 음식당 양(그램). 가정
items_per_meal = 2
grams_min = 100
grams_max = 300
# 계정마다 main_keywords에서 뽑아 두는 선호 음식 수
preferred_keywords = 4
# 식사 기록 중 저장 직후 음식 하나의 양을 고치는 비율. 서비스 저장소 docs/operations/synthetic-traffic.md 4.2절의 가정값
edit_probability = 0.15
# 검색어 후보. 공식 음식 목록 seed에서 결과가 나오는 것을 확인한 단어다(2026-10-28)
breakfast_keywords = ["오트밀", "요거트", "바나나", "사과", "토스트", "달걀", "고구마", "우유"]
main_keywords = ["김밥", "비빔밥", "샐러드", "닭가슴살", "된장찌개", "김치찌개", "현미밥", "두부", "샌드위치", "제육볶음"]

# 끼니 창(한국 시간, from 이상 to 미만)과 기록 확률. 세 끼니 창은 [traffic] 표의 피크와 앞뒤 완충 시간대에 맞춘다.
# 그 끼니 창에서 그날 처음 연 세션이 이 확률로 식사 기록 세션이 된다. 나머지 세션은 조회 세션이다(체중 기록 제외).
# 그래서 끼니마다 식사 기록은 하루 최대 한 번이다. 창은 정시에 걸쳐야 하고 서로 겹치면 안 된다. 확률 값은 가정.
# 아침과 간식은 breakfast_keywords에서, 점심·저녁은 계정의 선호 음식에서 검색어를 고른다
[personas.dieter.meals.BREAKFAST]
probability = 0.6
from = "06:00"
to = "09:00"

[personas.dieter.meals.LUNCH]
probability = 0.95
from = "11:00"
to = "14:00"

[personas.dieter.meals.DINNER]
probability = 0.9
from = "17:00"
to = "20:00"

# 오후 간식. 점심과 저녁 사이 창에서 그날 처음 연 세션이 이 확률로 간식 기록이 된다. 창과 확률은 가정
[personas.dieter.meals.SNACK]
probability = 0.3
from = "14:00"
to = "17:00"

# 아침 체중. 이 창 안의 조회 세션 중 그날 첫 번째가 probability로 체중 기록 세션이 된다(식사 기록 세션은 바꾸지 않는다).
# 체중 = 온보딩 체중 + (날짜 - reference_date)일 × trend_kg_per_day ± noise_kg. 20-300kg로 자르고 0.1kg로 반올림한다.
# reference_date를 바꾸면 모든 계정의 체중이 바뀐다. 값은 모두 가정
[personas.dieter.body_weight]
probability = 0.4
from = "06:00"
to = "10:00"
reference_date = "2026-10-30"
trend_kg_per_day = -0.05
noise_kg = 0.5
