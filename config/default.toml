# 운동 숙련자(2026-11-03 사용자 결정). 주 5-6회 저녁에 루틴 운동을 기록하고 끼니마다 식사를 기록한다.
# 하루 흐름은 다이어터와 같고 운동 요일만 주마다 정한다. 숫자는 모두 가정이다
[personas.expert]
weight = 9
# 앱을 자주 연다. 상한은 0.5(가장 큰 시간대 확률) × 활동 배수 × 1.5(가장 큰 계정 배수) <= 1이라 1.33이다
activity = 1.2
items_per_meal = 2
# 하루 목표를 지키는 무리. [personas.dieter]와 같은 값이다(가정)
