# 발생기 기본 설정. 다른 파일을 쓰려면 KKUGI_CONFIG에 경로를 준다.
# "가정"으로 적은 값은 확정 사양이 아니다. 실측이나 팀 합의가 나오면 바꾼다.
# 비밀값(토큰, 비밀 헤더 값)은 이 파일에 쓰지 않는다.

timezone = "Asia/Seoul"
api_prefix = "/api/v1"

[accounts]
# 인공 계정 이메일은 {email_prefix}-{번호 5자리}@{email_domain}이다.
# 서비스는 provider EMAIL_DEV이고 이메일이 lt-%@synthetic.kkugi.test인 회원을 인공 회원으로 센다(auth.md 5.5절).
# 바꾸면 이미 만든 회원과 패턴이 어긋난다
email_prefix = "lt"
email_domain = "synthetic.kkugi.test"
# 계정별 페르소나, 프로필, 하루 일정을 뽑는 난수 시드. 바꾸면 모든 계정의 값이 바뀐다
seed = 20261028

[auth]
# dev 로그인(POST /auth/login/dev)만 지원한다. 운영에서도 인공 트래픽용으로 켜져 있다(S15P31E101-342)
method = "dev"
# 액세스 토큰 만료까지 남은 시간이 이보다 짧으면 요청 전에 재발급한다(초)
refresh_margin_seconds = 120

[synthetic]
# 인공 요청 구분 헤더. 로그인을 포함한 모든 요청에 붙인다. backend는 이 헤더로 지표 태그 synthetic,
# 로그 필드 synthetic, span 속성을 남긴다(S15P31E101-342). 비우면 헤더를 붙이지 않는다
header_name = "X-Synthetic-Traffic"
header_value = "1"

[traffic]
# 계정이 h시 시간대에 앱을 열 확률 = open_probability[h] × 페르소나 activity × 계정 활동 배수.
# 계정마다 시간대별로 한 번 뽑으므로 한 시간대에 한 계정의 세션은 최대 하나다.
# 계정 수 × 확률이 그 시간대의 시간당 세션 수 기대값이다(계정 20,000개에 0.5면 10,000).
# 값은 사용자 확정값이다(2026-10-29, notes/decisions/2026-10-29-hourly-table.md)

# 0~23시(한국 시간) 각 시간대에 계정 하나가 앱을 열 확률. 24개, 0~1.
# 밤(1~5시) 0.01, 피크(7, 12, 18시) 0.5, 피크 앞뒤 완충(6, 8, 11, 13, 17, 19시) 0.25, 나머지 0.1
open_probability = [
  # 0     1     2     3     4     5     6     7
  0.1,  0.01, 0.01, 0.01, 0.01, 0.01, 0.25, 0.5,
  # 8     9     10    11    12    13    14    15
  0.25, 0.1,  0.1,  0.25, 0.5,  0.25, 0.1,  0.1,
  # 16    17    18    19    20    21    22    23
  0.1,  0.25, 0.5,  0.25, 0.1,  0.1,  0.1,  0.1,
]
# 계정 활동 배수와 비중 [배수, 비중]. 계정마다 시드와 계정 번호로 하나를 고정해 부지런한 계정과 뜸한 계정을 나눈다.
# 비중을 곱한 평균 배수는 1이어야 한다. 확률 최댓값 × 가장 큰 페르소나 activity × 가장 큰 배수는 1 이하여야 한다
activity_multipliers = [[0.5, 1], [1.0, 2], [1.5, 1]]

# --- 계정 풀 ---
# Worker는 KKUGI_POOL로 풀 하나를 고르고 그 범위의 계정만 실행한다. 풀끼리 번호 범위가 겹치면 안 된다.
# Master는 실행 중인 Worker끼리 계정 범위가 겹치면 나중에 붙은 Worker를 거부한다.
# only_between이 있으면 그 시간대(한국 시간)에 계획된 세션만 실행한다.

[pools.base]
# 서버의 상시 Worker
start = 0
count = 1000

[pools.peak-1]
# 팀원 노트북 Worker. 피크 시간대에만 추가 인구로 활동한다. 노트북마다 다른 풀을 쓴다. 가정
start = 10000
count = 1000
only_between = [["11:30", "13:30"], ["17:30", "19:30"]]

[pools.peak-2]
start = 11000
count = 1000
only_between = [["11:30", "13:30"], ["17:30", "19:30"]]

[schedule]
# 계획 시각보다 이만큼 늦으면 실행하지 않고 놓친 세션으로 센다(분). 실행기가 모자라면 늘어난다. 가정
max_lateness_minutes = 30

[think_time]
# 사용자가 검색어를 입력하고 결과에서 음식을 고르는 시간(초). 가정
search_min = 2.0
search_max = 6.0
select_min = 1.0
select_max = 4.0

# --- 페르소나 ---
# weight는 계정에 페르소나를 배정하는 비율이다. 구현한 페르소나만 둔다.
# 비율을 바꾸면 이미 쓰던 계정의 페르소나가 바뀔 수 있다. 상태 DB와 어긋나면 발생기가 그 계정을 거부한다.

[personas.dieter]
# 팀 문서의 비율은 35%다(가정). 지금은 다이어터만 구현해 모든 계정이 다이어터다
weight = 35
# 페르소나 활동 배수. 공통 표의 확률에 곱한다. 필수 값이다
activity = 1.0
# 하루에 앱을 쓰는 확률. 가정
active_probability = 0.8
# 한 끼의 음식 수와 음식당 양(그램). 가정
items_per_meal = 2
grams_min = 100
grams_max = 300
# 계정마다 main_keywords에서 뽑아 두는 선호 음식 수
preferred_keywords = 4
# 검색어 후보. 공식 음식 목록 seed에서 결과가 나오는 것을 확인한 단어다(2026-10-28)
breakfast_keywords = ["오트밀", "요거트", "바나나", "사과", "토스트", "달걀", "고구마", "우유"]
main_keywords = ["김밥", "비빔밥", "샐러드", "닭가슴살", "된장찌개", "김치찌개", "현미밥", "두부", "샌드위치", "제육볶음"]

# 끼니별 기록 확률과 식사 시각 범위(한국 시간). 활동한 날 기준이다. 가정
[personas.dieter.meals.BREAKFAST]
probability = 0.6
from = "07:00"
to = "08:30"

[personas.dieter.meals.LUNCH]
probability = 0.95
from = "11:40"
to = "13:10"

[personas.dieter.meals.DINNER]
probability = 0.9
from = "18:00"
to = "20:00"
